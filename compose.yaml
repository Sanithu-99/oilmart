services:
  postgres:
    image: postgres:15-alpine
    container_name: saranankara-oil-mart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oilmart
      POSTGRES_USER: oilmart
      POSTGRES_PASSWORD: oilmart_dev_password
    ports:
      - "55432:5432"
    volumes:
      - oilmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilmart -d oilmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oilmart-postgres-data:
