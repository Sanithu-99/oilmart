[build]
  # Netlify restores .next between builds. Clear that generated cache first so
  # Turbopack cannot publish HTML from this commit with a stale CSS bundle.
  command = "pnpm build:netlify"

[build.environment]
  NODE_VERSION = "22"
  # Public configuration values can legitimately appear in generated Next.js output.
  # Sensitive credentials remain protected by Netlify secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,NEXTAUTH_URL,NEON_BRANCH,NEON_AUTH_BASE_URL,NEON_AUTH_JWKS_URL,NEON_AI_GATEWAY_BASE_URL,NEON_REALTIME_URL,NEON_FUNCTION_HEALTH_BASE_URL,AWS_ENDPOINT_URL_S3,AWS_REGION,S3_ENDPOINT,S3_REGION,S3_BUCKET,S3_PUBLIC_URL,EMAIL_PROVIDER,SMS_PROVIDER"
